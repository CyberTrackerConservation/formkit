name: Build forms

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4  # ODK Validate, run by pyxform
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: formkit build
      - uses: actions/upload-artifact@v4
        with:
          name: forms
          path: build/
